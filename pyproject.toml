[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "neo-trader"
version = "0.1.2"
description = "Safe Python trading-system research engine with read-only broker access and guarded execution abstractions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1,<2",
    "grpcio>=1.75,<2",
    "httpx>=0.27",
    "protobuf>=6.31.1,<7",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyarrow>=16",
    "pyyaml>=6.0",
    "t-tech-investments==1.49.2",
    "zstandard>=0.23,<1",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.37",
]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["neo_trader", "neo_swarm_scalper"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["neo_trader"]
