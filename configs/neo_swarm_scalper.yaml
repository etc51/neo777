mode: paper_live_data
real_orders_enabled: false
paper_trading_enabled: true
token_env: TBANK_TOKEN

instruments:
  - name: neobitcoin
    display_name: Neobitcoin
    ticker: AUTO_DISCOVER
    figi: AUTO_DISCOVER
    class_code: AUTO_DISCOVER
    enabled: true

data:
  use_real_market_data: true
  orderbook_depth: 20
  collect_trades: true
  collect_orderbook: true
  collect_candles_1m: false
  collect_candles_5m: true
  collect_candles_15m: false
  reconnect: true
  stale_data_sec: 10

simulation:
  virtual_accounts_count: 1
  total_capital: 500000
  reserve_cash: 0
  working_capital: 500000
  initial_cash_per_account: 500000
  paper_leverage: 3
  leg_notional: 750000
  base_lot: 1
  max_position_lots_per_bot: 1
  allow_long: true
  allow_short: true
  allow_averaging: false
  allow_flip_without_close: false
  commission_bps: 0
  use_spread_cost: true
  use_slippage_cost: true
  fallback_slippage_ticks: 1
  max_trade_lifetime_sec: 3600
  close_all_before_session_end: true

strategy:
  timeframe: 5m
  entry_lookback_candles: 5
  entry_range_bps: 125
  rescue_trigger_bps: 70
  rescue_step_bps: 10
  take_profit_bps: 60
  stop_loss_bps: -250
  time_stop_min: 60
  preferred_spread_slippage_bps_side: 2
  hard_spread_slippage_bps_side: 3

risk:
  no_global_stop_on_paper_loss: true
  no_disable_due_to_paper_loss: true
  max_open_positions_per_bot: 1
  max_open_positions_total: 2
  max_trades_per_bot_per_day: 1000
  cooldown_after_loss_sec: 10
  cooldown_after_win_sec: 3

scalping:
  take_profit_ticks_min: 3
  take_profit_ticks_max: 8
  stop_loss_ticks_min: 2
  stop_loss_ticks_max: 10
  time_stop_sec_min: 120
  time_stop_sec_max: 120
  spread_max_ticks: 100
  min_impulse_ticks: 3

tail_catcher:
  stop_ticks: [10, 20, 40, 80, 160, 320]
  protection_trigger_bps: [1, 2, 3, 5]
  trailing_modes: [tight, normal, loose, expectancy_adaptive]
  default_protection_trigger_bps: 2
  default_trailing_mode: expectancy_adaptive
  control_entry_types: [book_flip_entry, impulse_continuation, pullback_continuation]
  control_min_direction_score: 0.45
  min_direction_margin: 0.10
  entry_confirmation_cycles: 2
  pressure_confirmation_window: 3
  pressure_confirmation_ratio: 0.67
  min_signed_velocity: 0.02
  min_edge_to_cost_ratio: 1.25
  max_stop_to_mfe_ratio: 0.85
  control_stop_bps: 5
  control_stop_ticks_min: 10
  control_stop_ticks_max: 600
  control_time_exit_sec: 120
  stop_confirmation_cycles: 2
  protection_confirmation_cycles: 1
  trailing_confirmation_cycles: 2
  time_exit_spread_grace_cycles: 6
  panic_stop_multiple: 2
  max_reentries_per_direction_per_instrument: 2
  max_consecutive_stops: 3
  cooldown_after_bad_series_sec: 300
  spread_max_ticks: 100
  spread_hard_bps: 12
  min_pressure_score: 0.12
  min_depth_top5: 10
  thin_book_depth_top5: 5
  protection_activation_pct_hint: 0.0015
  big_runner_mfe_bps: 60

curator:
  enabled: true
  update_interval_sec: 1
  scoring_window_trades: 30
  min_trades_before_weight_change: 10
  min_weight: 0.05
  max_weight: 1.00
  adaptive_tp_sl: false
  adaptive_cooldown: false
  adaptive_bot_enable: false
  shadow_mode_for_bad_bots: true

storage:
  sqlite_path: data/neo_swarm_scalper.sqlite
  wal_mode: true

reports:
  enabled: true
  interval_sec: 300
  markdown_dir: reports/neo_swarm_scalper

dashboard:
  enabled: true
  port: 8025
